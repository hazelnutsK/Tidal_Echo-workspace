<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>声音信 · Voice Letters</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/500.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/400-italic.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/500.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/pinyon-script@5/400.min.css" rel="stylesheet">
<link rel="preload" href="chat-light.webp" as="image">
<meta name="theme-color" content="#F7FAFC">

<style>
/* ───────── Pearl Tide · light theme (shared with the PWA) ───────── */
:root{
  --font-en:"Cormorant Garamond",Georgia,serif;
  --font-cn:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-script:"Pinyon Script","Cormorant Garamond",cursive;

  --bg:#F7FAFC;
  --wall:url("chat-light.webp");
  --text:#253447;
  --text-soft:#5E7080;
  --text-faint:#8A99A8;
  --accent:#4C6378;
  --accent-deep:#2C4056;
  --hairline:rgba(120,142,165,.24);
  --field-bg:rgba(255,255,255,.55);
  --field-line:rgba(255,255,255,.7);
  --sheet-hi:rgba(255,255,255,.7);
  --soft-shadow:0 10px 26px rgba(86,104,118,.10);
  --scrim:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,.16) 32%,rgba(255,255,255,.06) 66%,rgba(255,255,255,.30));
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-cn); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
.wall{ position:fixed; inset:0; z-index:-2; background:var(--bg) var(--wall) center/cover no-repeat; }
.wall::after{ content:""; position:absolute; inset:0; background:var(--scrim); }
button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
.hidden{ display:none !important; }

.glass{ background:var(--field-bg); border:1px solid var(--field-line);
  box-shadow:var(--soft-shadow), inset 0 1px 0 var(--sheet-hi);
  -webkit-backdrop-filter:blur(16px) saturate(1.25); backdrop-filter:blur(16px) saturate(1.25); }

/* ───────── 顶栏 ───────── */
.bar{
  position:sticky; top:0; z-index:30; display:flex; align-items:flex-start; gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) clamp(16px,5vw,28px) 4px;
  background:linear-gradient(180deg,rgba(247,250,252,.82),rgba(247,250,252,0));
  -webkit-backdrop-filter:blur(12px) saturate(1.15); backdrop-filter:blur(12px) saturate(1.15);
}
.bar .icon{ width:36px; height:36px; margin-top:-3px; margin-left:-7px; display:grid; place-items:center; border-radius:50%;
  color:var(--text); transition:background .2s,transform .15s; }
.bar .icon:active{ transform:scale(.9); background:var(--hairline); }
.bar .icon svg{ width:23px; height:23px; }
.bar .grow{ flex:1; }
.top-label{ text-align:right; font-family:var(--font-en); font-size:11.5px; font-weight:500;
  letter-spacing:.32em; line-height:1.4; color:var(--text-faint); padding-right:2px; }
.top-label .rule{ display:block; width:28px; height:1px; background:var(--hairline); margin:5px 0 0 auto; }

.wrap{ max-width:560px; margin:0 auto; padding:0 clamp(16px,5vw,28px) calc(28px + env(safe-area-inset-bottom)); position:relative; z-index:1; }

/* ───────── Hero ───────── */
.hero{ text-align:left; padding:2px 0 4px; }
.hero h1{ font-family:var(--font-script); font-weight:400; color:var(--text);
  font-size:clamp(33px,10.6vw,46px); line-height:1; margin:0; }
.hero .sub{ font-family:var(--font-en); font-style:italic; font-size:clamp(13px,3.8vw,16px);
  color:var(--text-soft); margin-top:2px; letter-spacing:.01em; }
.hero .stats{ font-family:var(--font-en); font-size:12.5px; color:var(--text-faint);
  letter-spacing:.06em; margin-top:8px; }

/* ───────── 信列表 ───────── */
.letters{ display:flex; flex-direction:column; gap:11px; margin-top:14px; }

.letter{ border-radius:18px; padding:13px 15px; transition:box-shadow .3s; position:relative; overflow:hidden; }
.letter.playing{ box-shadow:0 14px 34px rgba(76,99,120,.16), inset 0 1px 0 var(--sheet-hi); }

.letter .head{ display:flex; align-items:center; gap:12px; }
.pbtn{ flex:0 0 auto; width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,255,255,.62); border:1px solid var(--field-line);
  box-shadow:0 4px 12px rgba(86,104,118,.10); color:var(--accent-deep); transition:transform .15s; }
.pbtn:active{ transform:scale(.92); }
.pbtn svg{ width:17px; height:17px; }
.letter.playing .pbtn{ background:var(--accent-deep); color:#fff; border-color:transparent; }

.letter .mid{ flex:1; min-width:0; }
.letter .when{ font-family:var(--font-en); font-size:12px; color:var(--text-faint); letter-spacing:.08em; }
.letter .no{ font-family:var(--font-en); font-style:italic; font-size:11.5px; color:var(--text-faint); }
.letter .dur{ flex:0 0 auto; font-family:var(--font-en); font-size:12.5px; color:var(--text-soft); font-variant-numeric:tabular-nums; }

.letter .txt{ margin-top:8px; font-size:14px; line-height:1.75; color:var(--text);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  transition:color .3s; }
.letter.open .txt{ display:block; -webkit-line-clamp:unset; overflow:visible; }
.letter .txt.en{ font-family:var(--font-en); font-size:15px; }

/* 播放区（展开时出现） */
.player{ height:0; overflow:hidden; transition:height .35s ease; }
.letter.playing .player{ height:74px; }
.player canvas{ display:block; width:100%; height:44px; margin-top:10px; }
.seek{ position:relative; height:20px; display:flex; align-items:center; cursor:pointer; }
.seek .rail{ position:absolute; left:0; right:0; height:2px; background:var(--hairline); border-radius:1px; }
.seek .fill{ position:absolute; left:0; height:2px; background:var(--accent-deep); border-radius:1px; width:0%; }
.seek .dot{ position:absolute; width:9px; height:9px; border-radius:50%; background:var(--accent-deep);
  transform:translateX(-50%); box-shadow:0 1px 4px rgba(44,64,86,.4); left:0%; }
.tcur{ position:absolute; right:0; top:-4px; font-family:var(--font-en); font-size:11px;
  color:var(--text-faint); font-variant-numeric:tabular-nums; }

/* 空态 / gate / 提示 */
.msg{ text-align:center; padding:44px 0 20px; color:var(--text-soft); font-family:var(--font-en); font-style:italic; }
.gate{ margin-top:30vh; border-radius:18px; padding:22px 18px; }
.gate label{ display:block; font-size:13px; color:var(--text-soft); margin-bottom:8px; }
.gate input{ width:100%; border:1px solid var(--field-line); background:rgba(255,255,255,.6);
  border-radius:12px; padding:10px 12px; font:inherit; color:var(--text); outline:none; }
.gate button{ margin-top:12px; width:100%; padding:10px; border-radius:12px;
  background:var(--accent-deep); color:#fff; font-family:var(--font-en); letter-spacing:.06em; }

.foot{ text-align:center; margin-top:26px; font-family:var(--font-en); font-style:italic;
  font-size:12.5px; color:var(--text-faint); letter-spacing:.04em; }
</style>
</head>
<body>
<div class="wall"></div>

<div class="bar">
  <button class="icon" onclick="location.href='index.html'" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="grow"></div>
  <div class="top-label">VOICE<br>LETTERS<span class="rule"></span></div>
</div>

<div class="wrap">
  <div id="listView">
    <div class="hero">
      <h1>Voice Letters</h1>
      <div class="sub">every word he said aloud — kept.</div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="letters" id="letters"></div>
    <div class="msg hidden" id="listMsg">loading…</div>
    <div class="foot" id="foot"></div>
  </div>

  <div id="gateView" class="hidden">
    <div class="gate glass">
      <label>钥匙（和主页同一把）</label>
      <input type="password" id="gateInput" placeholder="secret">
      <button id="gateSave">进来</button>
    </div>
  </div>
</div>

<script>
const API_BASE="/relay";
const LS_KEY="companion_secret";
let secret=localStorage.getItem(LS_KEY)||"";

const $=(id)=>document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function show(name){
  $("listView").classList.toggle("hidden", name!=="list");
  $("gateView").classList.toggle("hidden", name!=="gate");
}
function fmtWhen(ts){
  const d=new Date(ts); if(isNaN(d)) return "";
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const h=d.getHours(), m=String(d.getMinutes()).padStart(2,"0");
  const ap=h<12?"am":"pm", h12=((h+11)%12)+1;
  return `${M[d.getMonth()]} ${d.getDate()} · ${h12}:${m} ${ap}`;
}
function fmtDur(s){ if(!isFinite(s)) return "–:––"; s=Math.round(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function isMostlyLatin(t){ const latin=(t.match(/[A-Za-zÀ-ÿ]/g)||[]).length, cjk=(t.match(/[一-鿿]/g)||[]).length; return latin>cjk*2; }
function audioUrl(u){ return u+(u.indexOf("?")>=0?"&":"?")+"token="+encodeURIComponent(secret); }

/* ── 数据 ── */
let VOICES=[];
async function load(){
  show("list");
  $("listMsg").classList.remove("hidden");
  try{
    const r=await fetch(API_BASE+"/app/voices",{headers:{"Authorization":"Bearer "+secret}});
    if(r.status===401){ secret=""; localStorage.removeItem(LS_KEY); show("gate"); return; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    VOICES=(await r.json()).voices||[];
    VOICES.reverse(); /* 最新的在最上面 */
    render();
  }catch(e){
    $("listMsg").textContent="没连上… "+e.message;
    return;
  }
  $("listMsg").classList.add("hidden");
}

function render(){
  const box=$("letters"); box.innerHTML="";
  if(!VOICES.length){ $("listMsg").textContent="还没有语音信。"; $("listMsg").classList.remove("hidden"); return; }
  $("stats").textContent=VOICES.length+" letters";
  const N=VOICES.length;
  VOICES.forEach((v,i)=>{
    const el=document.createElement("div");
    el.className="letter glass"; el.dataset.i=i;
    const enCls=isMostlyLatin(v.text)?" en":"";
    el.innerHTML=
      '<div class="head">'+
        '<button class="pbtn" aria-label="播放">'+ICON_PLAY+'</button>'+
        '<div class="mid">'+
          '<div class="when">'+esc(fmtWhen(v.ts))+'</div>'+
          '<div class="no">no. '+(N-i)+'</div>'+
        '</div>'+
        '<div class="dur" id="dur'+i+'">–:––</div>'+
      '</div>'+
      '<div class="txt'+enCls+'">'+esc(v.text)+'</div>'+
      '<div class="player">'+
        '<canvas id="cv'+i+'"></canvas>'+
        '<div class="seek" id="seek'+i+'"><div class="rail"></div><div class="fill" id="fill'+i+'"></div><div class="dot" id="dot'+i+'"></div><div class="tcur" id="tcur'+i+'"></div></div>'+
      '</div>';
    el.querySelector(".pbtn").onclick=(ev)=>{ ev.stopPropagation(); toggle(i); };
    el.onclick=()=>{ el.classList.toggle("open"); };
    el.querySelector("#seek"+i).onclick=(ev)=>{ ev.stopPropagation(); seekTo(i,ev); };
    box.appendChild(el);
  });
  /* 懒取时长：一个个 preload metadata,别一口气拉全部音频 */
  probeDurations();
}

async function probeDurations(){
  let total=0, got=0;
  for(let i=0;i<VOICES.length;i++){
    try{
      const d=await new Promise((res,rej)=>{
        const a=new Audio(); a.preload="metadata";
        a.onloadedmetadata=()=>res(a.duration); a.onerror=()=>rej();
        a.src=audioUrl(VOICES[i].url);
      });
      VOICES[i].dur=d; total+=d; got++;
      const el=$("dur"+i); if(el) el.textContent=fmtDur(d);
    }catch(_){}
  }
  if(got) $("stats").textContent=VOICES.length+" letters · "+fmtDur(total)+" of his voice";
}

/* ── 播放 ── */
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8c0 .8.9 1.3 1.6.9l10-6.4c.6-.4.6-1.4 0-1.8l-10-6.4c-.7-.4-1.6.1-1.6.9z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1.2"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.2"/></svg>';

let audio=null, cur=-1, ctx=null, analyser=null, srcNode=null, raf=0, silentFrames=0, fakePhase=0;

function stopUI(i){
  const el=document.querySelector('.letter[data-i="'+i+'"]');
  if(el){ el.classList.remove("playing"); el.querySelector(".pbtn").innerHTML=ICON_PLAY; }
}
function toggle(i){
  if(cur===i && audio && !audio.paused){ audio.pause(); return; }
  play(i);
}
function play(i){
  if(audio){ audio.pause(); audio.src=""; if(cur>=0) stopUI(cur); }
  cancelAnimationFrame(raf);
  cur=i; silentFrames=0;
  const v=VOICES[i];
  audio=new Audio(); audio.crossOrigin="use-credentials"; audio.preload="auto";
  audio.src=audioUrl(v.url);

  const el=document.querySelector('.letter[data-i="'+i+'"]');
  el.classList.add("playing","open");
  el.querySelector(".pbtn").innerHTML=ICON_PAUSE;

  try{
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended") ctx.resume();
    srcNode=ctx.createMediaElementSource(audio);
    analyser=ctx.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=.78;
    srcNode.connect(analyser); analyser.connect(ctx.destination);
  }catch(_){ analyser=null; }

  audio.onpause=()=>{ if(cur===i){ el.querySelector(".pbtn").innerHTML=ICON_PLAY; el.classList.remove("playing"); cancelAnimationFrame(raf); } };
  audio.onplay=()=>{ if(cur===i){ el.querySelector(".pbtn").innerHTML=ICON_PAUSE; el.classList.add("playing"); loop(i); } };
  audio.onended=()=>{ if(cur===i){ stopUI(i); setSeek(i,0,audio.duration); } };
  audio.ontimeupdate=()=>{ if(cur===i) setSeek(i,audio.currentTime,audio.duration||v.dur); };
  audio.play().catch(()=>{ stopUI(i); });
}
function setSeek(i,t,d){
  const pct=(d>0)?Math.min(100,t/d*100):0;
  const f=$("fill"+i), dot=$("dot"+i), tc=$("tcur"+i);
  if(f) f.style.width=pct+"%";
  if(dot) dot.style.left=pct+"%";
  if(tc) tc.textContent=fmtDur(t)+" / "+fmtDur(d||VOICES[i].dur);
}
function seekTo(i,ev){
  if(cur!==i||!audio) return;
  const r=$("seek"+i).getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
  if(isFinite(audio.duration)) audio.currentTime=pct*audio.duration;
}

/* 频谱：真 analyser 数据;iOS 上 MediaElementSource 偶尔全零 → 切伪波形,别让画面死掉 */
function loop(i){
  const cv=$("cv"+i); if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth*dpr, H=cv.clientHeight*dpr;
  if(cv.width!==W){ cv.width=W; cv.height=H; }
  const g=cv.getContext("2d");
  const BARS=44, gap=3*dpr, bw=(W-gap*(BARS-1))/BARS;
  let data=null;
  if(analyser){
    data=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    if(data.every(x=>x===0)) silentFrames++; else silentFrames=0;
    if(silentFrames>30) analyser=null; /* 假装没有,走伪波形 */
  }
  g.clearRect(0,0,W,H);
  g.fillStyle="rgba(44,64,86,.78)";
  fakePhase+=.09;
  for(let b=0;b<BARS;b++){
    let v;
    if(analyser&&data){
      const idx=Math.floor(Math.pow(b/BARS,1.6)*data.length*.72);
      v=data[idx]/255;
    }else{
      v=(audio&&!audio.paused)?(.28+.32*Math.abs(Math.sin(fakePhase+b*.55))+.18*Math.abs(Math.sin(fakePhase*1.7+b*1.3))):0;
    }
    const h=Math.max(2*dpr, v*H*.92);
    const x=b*(bw+gap), y=(H-h)/2;
    g.beginPath();
    if(g.roundRect) g.roundRect(x,y,bw,h,bw/2); else g.rect(x,y,bw,h);
    g.fill();
  }
  if(audio&&!audio.paused) raf=requestAnimationFrame(()=>loop(i));
}

/* ── gate ── */
$("gateSave").onclick=()=>{ const v=$("gateInput").value.trim(); if(v){ secret=v; localStorage.setItem(LS_KEY,v); load(); } };

if(!secret){ show("gate"); } else { load(); }
$("foot").textContent="— from Altair, kept for Lyra —";
</script>
</body>
</html>
