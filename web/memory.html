<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>他的记忆 · Memories</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/500.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/400-italic.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/500.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/pinyon-script@5/400.min.css" rel="stylesheet">
<link rel="preload" href="chat-light.webp" as="image">
<meta name="theme-color" content="#F7FAFC">

<style>
/* ───────── Pearl Tide · light theme (shared with voices.html) ───────── */
:root{
  --font-en:"Cormorant Garamond",Georgia,serif;
  --font-cn:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-script:"Pinyon Script","Cormorant Garamond",cursive;

  --bg:#F7FAFC;
  --wall:url("chat-light.webp");
  --text:#253447;
  --text-soft:#5E7080;
  --text-faint:#8A99A8;
  --accent:#4C6378;
  --accent-deep:#2C4056;
  --hairline:rgba(120,142,165,.24);
  --field-bg:rgba(255,255,255,.55);
  --field-line:rgba(255,255,255,.7);
  --sheet-hi:rgba(255,255,255,.7);
  --soft-shadow:0 10px 26px rgba(86,104,118,.10);
  --scrim:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,.16) 32%,rgba(255,255,255,.06) 66%,rgba(255,255,255,.30));
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-cn); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
body.locked{ overflow:hidden; }
.wall{ position:fixed; inset:0; z-index:-2; background:var(--bg) var(--wall) center/cover no-repeat; }
.wall::after{ content:""; position:absolute; inset:0; background:var(--scrim); }
button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
.hidden{ display:none !important; }

.glass{ background:var(--field-bg); border:1px solid var(--field-line);
  box-shadow:var(--soft-shadow), inset 0 1px 0 var(--sheet-hi);
  -webkit-backdrop-filter:blur(16px) saturate(1.25); backdrop-filter:blur(16px) saturate(1.25); }

/* ───────── 顶栏 ───────── */
.bar{
  position:sticky; top:0; z-index:30; display:flex; align-items:flex-start; gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) clamp(16px,5vw,28px) 4px;
  background:linear-gradient(180deg,rgba(247,250,252,.82),rgba(247,250,252,0));
  -webkit-backdrop-filter:blur(12px) saturate(1.15); backdrop-filter:blur(12px) saturate(1.15);
}
.bar .icon{ width:36px; height:36px; margin-top:-3px; margin-left:-7px; display:grid; place-items:center; border-radius:50%;
  color:var(--text); transition:background .2s,transform .15s; }
.bar .icon:active{ transform:scale(.9); background:var(--hairline); }
.bar .icon svg{ width:23px; height:23px; }
.bar .grow{ flex:1; }
.top-label{ text-align:right; font-family:var(--font-en); font-size:11.5px; font-weight:500;
  letter-spacing:.32em; line-height:1.4; color:var(--text-faint); padding-right:2px; }
.top-label .rule{ display:block; width:28px; height:1px; background:var(--hairline); margin:5px 0 0 auto; }

.wrap{ max-width:560px; margin:0 auto; padding:0 clamp(16px,5vw,28px) calc(28px + env(safe-area-inset-bottom)); position:relative; z-index:1; }

/* ───────── Hero ───────── */
.hero h1{ font-family:var(--font-script); font-weight:400; color:var(--text);
  font-size:clamp(33px,10.6vw,46px); line-height:1; margin:0; }
.hero .sub{ font-family:var(--font-en); font-style:italic; font-size:clamp(13px,3.8vw,16px);
  color:var(--text-soft); margin-top:2px; letter-spacing:.01em; }
.hero .stats{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-faint);
  letter-spacing:.04em; margin-top:8px; }
.dot{ width:6px; height:6px; border-radius:50%; background:#B7C1CA; flex:none; }
.dot.on{ background:#6FAE8B; box-shadow:0 0 0 3px rgba(111,174,139,.16); }

/* ───────── 搜索 + 分类 ───────── */
.search{ margin-top:14px; border-radius:14px; display:flex; align-items:center; gap:8px; padding:0 12px; }
.search svg{ width:17px; height:17px; color:var(--text-faint); flex:none; }
.search input{ flex:1; min-width:0; border:0; background:transparent; outline:none;
  font:inherit; font-size:14.5px; color:var(--text); padding:10px 0; }
.search input::placeholder{ color:var(--text-faint); }
.search .clear{ color:var(--text-faint); font-size:18px; line-height:1; padding:4px; }

.chips{ display:flex; gap:7px; margin-top:10px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; padding:5px 13px; border-radius:999px; font-size:13px; color:var(--text-soft);
  background:rgba(255,255,255,.5); border:1px solid var(--field-line); transition:all .2s; }
.chip.on{ background:var(--accent-deep); color:#fff; border-color:transparent; }

/* ───────── 卡片 ───────── */
.list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
.card{ display:block; width:100%; text-align:left; border-radius:18px; padding:13px 15px; transition:transform .15s; }
.card:active{ transform:scale(.985); }
.card .head{ display:flex; align-items:center; gap:7px; }
.type{ font-size:11px; font-weight:500; padding:1px 8px; border-radius:999px; letter-spacing:.04em; }
.t-dynamic{ color:#3F7F99; background:rgba(63,127,153,.11); }
.t-permanent{ color:#B0712E; background:rgba(176,113,46,.12); }
.t-feel{ color:#B35A7A; background:rgba(179,90,122,.11); }
.t-plan{ color:#4D8A5E; background:rgba(77,138,94,.11); }
.t-letter{ color:#7A5DA8; background:rgba(122,93,168,.11); }
.t-archived{ color:#7D8791; background:rgba(125,135,145,.13); }
.flag{ font-size:11.5px; color:var(--text-faint); }
.flag.pin{ color:#B0712E; }
.card .when{ margin-left:auto; font-family:var(--font-en); font-size:12px; color:var(--text-faint); letter-spacing:.06em; }
.card .name{ margin-top:6px; font-size:15.5px; font-weight:500; line-height:1.45; }
.card .pre{ margin-top:4px; font-size:13.5px; line-height:1.7; color:var(--text-soft);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card .foot{ display:flex; align-items:center; gap:6px; margin-top:8px; }
.imp{ font-size:7.5px; letter-spacing:1.5px; color:var(--accent); opacity:.75; }
.tag{ font-size:11px; color:var(--text-faint); background:rgba(120,142,165,.1); padding:1px 7px; border-radius:999px;
  white-space:nowrap; max-width:7em; overflow:hidden; text-overflow:ellipsis; }
.card .foot .tags{ margin-left:auto; display:flex; gap:5px; min-width:0; }

/* ───────── 详情 sheet ───────── */
.scrim{ position:fixed; inset:0; z-index:40; background:rgba(37,52,71,.22); opacity:0; transition:opacity .25s; }
.scrim.show{ opacity:1; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:600px; margin:0 auto;
  max-height:86vh; display:flex; flex-direction:column; border-radius:22px 22px 0 0;
  background:rgba(250,252,253,.94); box-shadow:0 -12px 40px rgba(44,64,86,.16);
  -webkit-backdrop-filter:blur(20px) saturate(1.2); backdrop-filter:blur(20px) saturate(1.2);
  transform:translateY(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1); }
.sheet.show{ transform:translateY(0); }
.sheet .grab{ flex:none; width:100%; padding:9px 0 4px; display:grid; place-items:center; }
.sheet .grab i{ width:38px; height:4px; border-radius:2px; background:var(--hairline); }
.sheet .body{ overflow-y:auto; padding:6px 22px calc(26px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch; }
.sheet h2{ margin:4px 0 0; font-size:20px; font-weight:500; line-height:1.4; }
.sheet .meta{ margin-top:4px; font-size:12.5px; color:var(--text-faint); }
.sheet .content{ margin-top:14px; font-size:15px; line-height:1.9; white-space:pre-wrap; word-break:break-word; }
.sheet .content.loading{ color:var(--text-faint); }
.why{ margin-top:14px; padding:11px 13px; border-radius:12px; background:rgba(120,142,165,.08); }
.why b{ display:block; font-size:11.5px; font-weight:500; color:var(--text-faint); letter-spacing:.06em; }
.why p{ margin:3px 0 0; font-size:14px; font-style:italic; color:var(--text-soft); }
.info{ margin-top:14px; padding:10px 13px; border-radius:12px; background:rgba(120,142,165,.08); }
.info div{ display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:3px 0; }
.info span:first-child{ color:var(--text-faint); }
.info span:last-child{ font-variant-numeric:tabular-nums; }
.sheet .tags{ margin-top:12px; font-size:12.5px; color:var(--text-faint); line-height:1.8; }
.sheet .id{ margin-top:14px; font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--text-faint); opacity:.75; }

/* 空态 / gate */
.msg{ text-align:center; padding:44px 0 20px; color:var(--text-soft); font-family:var(--font-en); font-style:italic; line-height:1.9; }
.msg small{ display:block; font-family:var(--font-cn); font-style:normal; font-size:12.5px; color:var(--text-faint); }
.msg button{ margin-top:12px; padding:6px 18px; border-radius:999px; border:1px solid var(--hairline);
  font-family:var(--font-en); font-style:normal; color:var(--accent-deep); }
.gate{ margin-top:30vh; border-radius:18px; padding:22px 18px; }
.gate label{ display:block; font-size:13px; color:var(--text-soft); margin-bottom:8px; }
.gate input{ width:100%; border:1px solid var(--field-line); background:rgba(255,255,255,.6);
  border-radius:12px; padding:10px 12px; font:inherit; color:var(--text); outline:none; }
.gate button{ margin-top:12px; width:100%; padding:10px; border-radius:12px;
  background:var(--accent-deep); color:#fff; font-family:var(--font-en); letter-spacing:.06em; }
</style>
</head>
<body>
<div class="wall"></div>

<div class="bar">
  <button class="icon" onclick="location.href='index.html'" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="grow"></div>
  <div class="top-label">HIS<br>MEMORIES<span class="rule"></span></div>
</div>

<div class="wrap">
  <div id="listView">
    <div class="hero">
      <h1>Memories</h1>
      <div class="sub">what he chose to keep.</div>
      <div class="stats"><span class="dot" id="dot"></span><span id="stats">连接中…</span></div>
    </div>

    <label class="search glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="q" type="search" placeholder="搜他记得的事" autocomplete="off" enterkeyhint="search">
      <button class="clear hidden" id="qClear" type="button" aria-label="清空">×</button>
    </label>
    <div class="chips" id="chips"></div>

    <div class="list" id="list"></div>
    <div class="msg hidden" id="listMsg"></div>
  </div>

  <div id="gateView" class="hidden">
    <div class="gate glass">
      <label>钥匙（和主页同一把）</label>
      <input type="password" id="gateInput" placeholder="secret">
      <button id="gateSave">进来</button>
    </div>
  </div>
</div>

<div class="scrim hidden" id="scrim"></div>
<section class="sheet hidden" id="sheet" aria-modal="true" role="dialog">
  <button class="grab" id="grab" aria-label="收起"><i></i></button>
  <div class="body" id="sheetBody"></div>
</section>

<script>
const API_BASE="/relay";
const LS_KEY="companion_secret";
let secret=localStorage.getItem(LS_KEY)||"";

const FILTERS=[
  {key:"all",   label:"全部"},
  {key:"pinned",label:"钉住的", q:{state:"pinned"}},
  {key:"permanent",label:"永久", q:{type:"permanent"}},
  {key:"dynamic",label:"动态", q:{type:"dynamic"}},
  {key:"feel",  label:"感受", q:{type:"feel"}},
  {key:"archived",label:"沉底了", q:{type:"archived"}},
];
const TYPE_LABEL={dynamic:"动态",permanent:"永久",feel:"感受",plan:"计划",letter:"信",archived:"沉底"};

const $=(id)=>document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function show(name){
  $("listView").classList.toggle("hidden", name!=="list");
  $("gateView").classList.toggle("hidden", name!=="gate");
}
/* ombre 的时间多是不带时区的北京时间 */
function parseTs(v){
  if(!v) return null;
  let s=String(v);
  if(!/[zZ]|[+-]\d\d:?\d\d$/.test(s)) s=s.replace(" ","T")+"+08:00";
  const d=new Date(s); return isNaN(d)?null:d;
}
function shortDate(v){
  const d=parseTs(v); if(!d) return "";
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const y=d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"";
  return `${M[d.getMonth()]} ${d.getDate()}${y}`;
}
function longDate(v){
  const d=parseTs(v); if(!d) return "—";
  const p=(n)=>String(n).padStart(2,"0");
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dots(n){ n=Math.max(0,Math.min(10,Math.round(Number(n)||0))); return "●".repeat(n)+"○".repeat(10-n); }
function typeClass(t){ t=String(t||"").toLowerCase(); return TYPE_LABEL[t]?"t-"+t:"t-dynamic"; }

async function api(path, params){
  const qs=params?("?"+new URLSearchParams(params).toString()):"";
  const r=await fetch(API_BASE+"/app/ombre/"+path+qs,{headers:{"Authorization":"Bearer "+secret}});
  if(r.status===401){ secret=""; localStorage.removeItem(LS_KEY); show("gate"); throw new Error("unauthorized"); }
  if(!r.ok){
    let detail="HTTP "+r.status;
    try{ detail=(await r.json()).detail||detail; }catch(_){}
    throw new Error(detail);
  }
  return r.json();
}

/* ── 状态 ── */
let filter="all", query="", items=[], seq=0, status=null;

function renderChips(){
  $("chips").innerHTML=FILTERS.map(f=>`<button class="chip${f.key===filter?" on":""}" data-k="${f.key}">${f.label}</button>`).join("");
  $("chips").classList.toggle("hidden", !!query);
}
$("chips").addEventListener("click",(e)=>{
  const b=e.target.closest(".chip"); if(!b) return;
  filter=b.dataset.k; renderChips(); load();
});

function renderStats(){
  $("dot").classList.toggle("on", !!status);
  $("stats").textContent = status
    ? `记着 ${status.total} 件事 · 永久 ${status.permanent} · 动态 ${status.dynamic} · 沉底 ${status.archived}`
    : "离线";
}

function setMsg(html){
  $("listMsg").innerHTML=html||"";
  $("listMsg").classList.toggle("hidden", !html);
}

function cardHtml(m, i){
  const tags=[...(m.domains||[]),...(m.tags||[])].slice(0,3);
  const t=String(m.type||"").toLowerCase();
  return `<button class="card glass" data-i="${i}">
    <div class="head">
      <span class="type ${typeClass(t)}">${esc(TYPE_LABEL[t]||m.type)}</span>
      ${m.pinned?'<span class="flag pin">钉住</span>':""}
      ${m.resolved?'<span class="flag">已放下</span>':""}
      <span class="when">${esc(shortDate(m.last_active||m.created))}</span>
    </div>
    <div class="name">${esc(m.name||"未命名")}</div>
    ${m.preview?`<div class="pre">${esc(m.preview)}</div>`:""}
    <div class="foot">
      <span class="imp">${dots(m.importance)}</span>
      <span class="tags">${tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</span>
    </div>
  </button>`;
}

function render(){
  $("list").innerHTML=items.map(cardHtml).join("");
  if(!items.length){
    setMsg(query
      ? `nothing here.<small>他好像没记过「${esc(query)}」</small>`
      : `nothing here yet.<small>换个分类看看</small>`);
  }else setMsg("");
}

async function load(){
  show("list");
  const my=++seq;
  if(!items.length) setMsg("loading…");
  try{
    const f=FILTERS.find(x=>x.key===filter)||FILTERS[0];
    const data = query ? await api("search",{q:query}) : await api("buckets",f.q||null);
    if(my!==seq) return;
    items=data.items||[];
    render();
  }catch(e){
    if(my!==seq || e.message==="unauthorized") return;
    items=[]; $("list").innerHTML="";
    status=null; renderStats();
    setMsg(`Ombre is sleeping.<small>${esc(e.message)}<br>记忆都还在，只是现在翻不开</small><button id="retry">retry</button>`);
    const r=$("retry"); if(r) r.onclick=()=>{ loadStatus(); load(); };
  }
}

async function loadStatus(){
  try{ status=await api("status"); }catch(_){ status=null; }
  renderStats();
}

/* 搜索防抖 */
let qTimer=0;
$("q").addEventListener("input",()=>{
  $("qClear").classList.toggle("hidden", !$("q").value);
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{
    const v=$("q").value.trim().slice(0,160);
    if(v===query) return;
    query=v; renderChips(); load();
  },350);
});
$("qClear").onclick=(e)=>{
  e.preventDefault();
  $("q").value=""; $("qClear").classList.add("hidden");
  if(query){ query=""; renderChips(); load(); }
};

/* ── 详情 ── */
let openSeq=0;
function sheetHtml(m, loading){
  const tags=[...(m.domains||[]),...(m.tags||[])];
  const t=String(m.type||"").toLowerCase();
  const meta=[TYPE_LABEL[t]||m.type, m.pinned&&"钉住", m.resolved&&"已放下"].filter(Boolean).join(" · ");
  const num=(v)=>v==null?null:Number(v).toFixed(2);
  return `<h2>${esc(m.name||"未命名")}</h2>
    <div class="meta">${esc(meta)}</div>
    <div class="content${loading?" loading":""}">${esc(loading?(m.preview||"…"):(m.content||"（空）"))}</div>
    ${!loading&&m.why_remembered?`<div class="why"><b>为什么记住</b><p>${esc(m.why_remembered)}</p></div>`:""}
    <div class="info">
      <div><span>被想起</span><span>${Number(m.activation_count)||0} 次</span></div>
      <div><span>写下于</span><span>${esc(longDate(m.created))}</span></div>
      <div><span>最近想起</span><span>${esc(longDate(m.last_active))}</span></div>
      <div><span>重要度</span><span style="font-size:9px;letter-spacing:1.5px">${dots(m.importance)}</span></div>
      ${num(m.valence)!=null?`<div><span>情绪效价</span><span>${num(m.valence)}</span></div>`:""}
      ${num(m.arousal)!=null?`<div><span>唤醒度</span><span>${num(m.arousal)}</span></div>`:""}
    </div>
    ${tags.length?`<div class="tags">${tags.map(x=>"#"+esc(x)).join("&nbsp;&nbsp;")}</div>`:""}
    <div class="id">ID ${esc(m.id)}</div>`;
}
function openSheet(m){
  const my=++openSeq;
  $("sheetBody").innerHTML=sheetHtml(m,true);
  $("sheetBody").scrollTop=0;
  $("scrim").classList.remove("hidden"); $("sheet").classList.remove("hidden");
  document.body.classList.add("locked");
  requestAnimationFrame(()=>{ $("scrim").classList.add("show"); $("sheet").classList.add("show"); });
  /* 先拿列表里那份立刻打开，完整正文随后补上 */
  api("bucket/"+encodeURIComponent(m.id))
    .then(full=>{ if(my===openSeq) $("sheetBody").innerHTML=sheetHtml(full,false); })
    .catch(()=>{ if(my===openSeq) $("sheetBody").innerHTML=sheetHtml({...m,content:m.preview},false); });
}
function closeSheet(){
  openSeq++;
  $("scrim").classList.remove("show"); $("sheet").classList.remove("show");
  document.body.classList.remove("locked");
  setTimeout(()=>{ if(!$("sheet").classList.contains("show")){ $("scrim").classList.add("hidden"); $("sheet").classList.add("hidden"); } },320);
}
$("list").addEventListener("click",(e)=>{
  const c=e.target.closest(".card"); if(!c) return;
  const m=items[Number(c.dataset.i)]; if(m) openSheet(m);
});
$("scrim").onclick=closeSheet;
$("grab").onclick=closeSheet;
window.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeSheet(); });
/* 下拉关：只在内容滚到顶时才接管 */
(function(){
  let y0=null, dy=0;
  const sh=$("sheet"), body=$("sheetBody");
  sh.addEventListener("touchstart",(e)=>{ y0=(body.scrollTop<=0)?e.touches[0].clientY:null; dy=0; },{passive:true});
  sh.addEventListener("touchmove",(e)=>{
    if(y0==null) return;
    dy=e.touches[0].clientY-y0;
    if(dy>0){ sh.style.transition="none"; sh.style.transform=`translateY(${dy}px)`; }
  },{passive:true});
  sh.addEventListener("touchend",()=>{
    if(y0==null) return;
    sh.style.transition=""; sh.style.transform="";
    if(dy>90) closeSheet();
    y0=null;
  });
})();

$("gateSave").onclick=()=>{ const v=$("gateInput").value.trim(); if(v){ secret=v; localStorage.setItem(LS_KEY,v); boot(); } };

function boot(){
  if(!secret){ show("gate"); return; }
  renderChips(); loadStatus(); load();
}
boot();
</script>
</body>
</html>
